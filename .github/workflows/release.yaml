name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------- 1. 构建 VS Code 插件 -------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VS Code Extension
        run: pnpm run build --production

      - name: Package VS Code Extension
        run: pnpm exec vsce package --no-dependencies

      - name: Get VSIX Path
        id: vsix_path
        run: |
          VSIX_FILE=$(find . -maxdepth 1 -name "*.vsix" | head -n 1)
          echo "Found VSIX file: $VSIX_FILE"
          echo "path=$VSIX_FILE" >> $GITHUB_OUTPUT

      # ------------------- 2. 构建 IntelliJ / WebStorm 插件 -------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: |
            intellij-plugin/build.gradle.kts
            intellij-plugin/settings.gradle.kts
            intellij-plugin/gradle/wrapper/gradle-wrapper.properties

      - name: Build IntelliJ Plugin
        run: |
          cd intellij-plugin
          chmod +x ./gradlew
          ./gradlew buildPlugin

      - name: Get IntelliJ Plugin Path
        id: intellij_zip_path
        run: |
          ZIP_FILE=$(find intellij-plugin/build/distributions -name "*.zip" | head -n 1)
          echo "Found IntelliJ plugin file: $ZIP_FILE"
          echo "path=$ZIP_FILE" >> $GITHUB_OUTPUT

      # ------------------- 3. 提取更新日志与发布 -------------------
      - name: Extract Changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -n "/^## \[$VERSION\]/,/^---/p" CHANGELOG.md | sed '$d' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            cat CHANGELOG.md > RELEASE_NOTES.md
          fi

      - name: Publish to VS Code Marketplace
        if: ${{ env.VS_MARKETPLACE_TOKEN != '' }}
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.vsix_path.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            ${{ steps.vsix_path.outputs.path }}
            ${{ steps.intellij_zip_path.outputs.path }}
